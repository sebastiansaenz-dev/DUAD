<!doctype html>
<html>
  <head>
    <title>Users — Admin Panel</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-brand">
        <span class="navbar-brand-mark"></span>
        <h1>Inventory</h1>
      </div>
      <nav class="navbar-links">
        <a class="navbar-link" href="../edit-products-page/products.html"
          >Products</a
        >
        <a class="navbar-link" href="../orders-page/orders.html">Orders</a>
        <a class="navbar-link active" href="./users.html">Users</a>
        <a class="navbar-link" href="../../product-catalog-page/products.html"
          >Client Panel</a
        >
        </button>
      </nav>
    </header>

    <div class="app">
      <aside class="sidebar">
        <div>
          <div class="filter-title">Role</div>
          <ul class="filter-list" id="roleList"></ul>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="topbar">
          <div>
            <h2>Users</h2>
            <p id="subtitle">View, edit, or remove user accounts.</p>
          </div>
          <div class="controls">
            <div class="search">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                type="text"
                id="searchInput"
                placeholder="Search username or email"
              />
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th style="text-align: right">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" style="display: none">
            <h3>No users match</h3>
            <p>Try a different search or role.</p>
          </div>
        </div>

        <nav class="pagination" id="pagination" aria-label="User pages">
          <button
            type="button"
            class="pagination-btn"
            id="prevPageBtn"
            aria-label="Previous page"
          >
            ‹ Prev
          </button>

          <div class="pagination-pages" id="paginationPages"></div>

          <button
            type="button"
            class="pagination-btn"
            id="nextPageBtn"
            aria-label="Next page"
          >
            Next ›
          </button>
        </nav>
      </main>
    </div>

    <!-- Slide panel: edit user -->
    <div class="overlay" id="overlay"></div>
    <div class="panel" id="panel">
      <div class="panel-head">
        <h2 id="panelTitle">Edit user</h2>
        <button class="panel-close" id="panelClose" aria-label="Close">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="userForm">
        <div class="panel-body">
          <div class="field">
            <label for="f_username">Username</label>
            <input type="text" id="f_username" required />
          </div>

          <div class="field">
            <label for="f_email">Email</label>
            <input type="email" id="f_email" required />
          </div>

          <div class="field">
            <label for="f_role">Role</label>
            <select id="f_role"></select>
          </div>
        </div>

        <div class="panel-foot">
          <button type="button" class="btn btn-ghost" id="cancelBtn">
            Cancel
          </button>
          <button type="submit" class="btn btn-accent" id="saveBtn">
            Save changes
          </button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="./scripts/users.js"></script>
  </body>
</html>
