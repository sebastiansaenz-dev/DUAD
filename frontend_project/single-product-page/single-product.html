        <ul class="nav-links">
          <li class="nav-link"><a href="../landing-page/home.html">Home</a></li>
          <li class="nav-link">
            <a href="../product-catalog-page/products.html">Products</a>
          </li>
        </ul>
        <div id="cart-logo-container" class="cart-logo-container"></div>
      </nav>
    </header>

    <main id="product-container" class="product-container">
      <div class="product-img">
        <img id="image" src="" alt="product-image" />
      </div>

      <div class="product-details">
        <div class="product-info">
          <span id="brand" class="product-brand"></span>
          <h1 id="name" class="product-name"></h1>
          <span id="price" class="product-price"></span>
          <p id="description" class="product-description"></p>
        </div>

        <div class="quantity-selector">
          <button id="decrease-quantity" class="quantity-btn">−</button>
          <input
            type="number"
            id="quantity-input"
            class="quantity-input"
            value="1"
            min="1"
            max="100"
          />
          <button id="increase-quantity" class="quantity-btn">+</button>
        </div>

        <button id="add-to-cart-button" class="add-to-cart-button">
          Add to cart
        </button>

        <div id="success-message" class="success-message"></div>
      </div>
    </main>
    <script type="module" src="./scripts/single-product.js"></script>
